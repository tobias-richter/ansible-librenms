---
- name: Create librenms group.
  ansible.builtin.group:
    name: "librenms"
    state: present

- name: Create librenms user.
  ansible.builtin.user:
    name: librenms
    shell: /bin/bash
    group:
    groups:
      - librenms
    home: /opt/librenms
    create_home: false
    append: false
    system: true
    state: present
  notify:
    - Restart apache

- name: Add www-data to librenms group.
  ansible.builtin.user:
    name: www-data
    groups:
      - www-data
      - librenms
  notify:
    - Restart apache
